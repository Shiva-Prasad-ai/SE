<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_7 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_7" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_7');
  const devicePixelRatio = window.devicePixelRatio || 1;
  
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(window.devicePixelRatio);
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);
const pointLight = new THREE.PointLight(0x312e81, 1); // Using design system primary color
pointLight.position.set(5, 5, 5);
scene.add(pointLight);

// The Ring
const geometry = new THREE.TorusGeometry(3.5, 0.05, 16, 100);
const material = new THREE.MeshPhongMaterial({ 
    color: 0x312e81, 
    emissive: 0x312e81,
    emissiveIntensity: 0.5,
    shininess: 100 
});
const ring = new THREE.Mesh(geometry, material);
ring.rotation.x = Math.PI / 2;
scene.add(ring);

// Orbiting particles/nodes to represent the phases
const nodesCount = 6;
const nodes = [];
for (let i = 0; i < nodesCount; i++) {
    const nodeGeom = new THREE.SphereGeometry(0.15, 32, 32);
    const nodeMat = new THREE.MeshPhongMaterial({ color: 0x6366f1 });
    const node = new THREE.Mesh(nodeGeom, nodeMat);
    
    const angle = (i / nodesCount) * Math.PI * 2;
    node.position.x = Math.cos(angle) * 3.5;
    node.position.z = Math.sin(angle) * 3.5;
    
    ring.add(node);
    nodes.push(node);
}

camera.position.z = 8;

let mouseX = 0;
let mouseY = 0;
let targetRotationX = 0;
let targetRotationY = 0;

window.addEventListener('mousemove', (event) => {
    mouseX = (event.clientX / window.innerWidth) * 2 - 1;
    mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
});

const animate = () => {
    requestAnimationFrame(animate);
    
    // Auto-rotation
    ring.rotation.z += 0.005;
    
    // Mouse control influence
    targetRotationY = mouseX * 0.5;
    targetRotationX = mouseY * 0.5;
    
    ring.rotation.x += (targetRotationX + Math.PI/2.5 - ring.rotation.x) * 0.05;
    ring.rotation.y += (targetRotationY - ring.rotation.y) * 0.05;

    renderer.render(scene, camera);
};

window.addEventListener('resize', () => {
    const newWidth = container.clientWidth || window.innerWidth;
    const newHeight = container.clientHeight || window.innerHeight;
    camera.aspect = newWidth / newHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(newWidth, newHeight);
});

animate();

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_7 -->
</body>
</html>
